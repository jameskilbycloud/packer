name: Validate

# ── Triggers ──────────────────────────────────────────────────────────────────
# Runs on every PR that touches Packer files, and on direct pushes to main.
# Runs on the same self-hosted runner as the rest of the pipeline (no real
# secrets needed — `packer validate` checks syntax and variable references only
# and never contacts vSphere). Keeping every workflow on the same runner
# matches the "everything driven from GitHub against a runner you control"
# operating model.
on:
  pull_request:
    branches:
      - main
    paths:
      - "*.pkr.hcl"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

  push:
    branches:
      - main
    paths:
      - "*.pkr.hcl"
      - "templates/**"

  # Allow manual runs (useful for debugging workflow changes)
  workflow_dispatch:

# ── Token scope ───────────────────────────────────────────────────────────────
# Read-only access to the repository — validate only reads code, runs
# `packer fmt --check` / `packer validate` / lint-user-data.sh against the
# checkout, and reports back via the PR check status (which uses workflow
# scope, not GITHUB_TOKEN). No GitHub API writes anywhere.
permissions:
  contents: read

# ── Concurrency ───────────────────────────────────────────────────────────────
# Cancel any in-progress validate run for the same PR/branch so stale checks
# don't block merges.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Packer fmt & validate
    # Do NOT run fork PRs on the self-hosted runner. This job checks out and
    # executes PR-controlled content (packer init/validate, lint-user-data.sh)
    # on a runner inside the vSphere network; a malicious fork PR could run
    # arbitrary code there. Restrict to pushes and same-repo (branch) PRs.
    # Fork PRs get these checks once a maintainer pushes the branch into the
    # repo. Belt-and-braces alongside the "require approval for outside
    # collaborators" Actions setting.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Install Packer (idempotent, best-effort) ─────────────────────────────
      # On a runner pre-provisioned per docs/operations.md the binary is
      # already on PATH and this step is a no-op. The fallback install needs
      # sudo; if that fails (no sudo, network, broken APT) we DON'T fail the
      # job here — continue-on-error: true lets the workflow proceed and the
      # next step that calls `packer` surfaces a clear "command not found".
      # Pre-install per docs/operations.md to avoid relying on this fallback.
      - name: Install Packer
        continue-on-error: true
        uses: ./.github/actions/install-verified-binary
        with:
          tool: packer

      # ── Install cloud-init (idempotent, best-effort) ─────────────────────────
      # Required by the "Validate user-data against cloud-init schema" step
      # below (scripts/lint-user-data.sh shells out to `cloud-init schema`).
      # As with Packer above, this is best-effort — pre-install per
      # docs/operations.md to avoid relying on the fallback.
      - name: Install cloud-init
        continue-on-error: true
        run: |
          if command -v cloud-init &>/dev/null; then
            echo "cloud-init already installed: $(cloud-init --version 2>&1 | head -1)"
            exit 0
          fi
          echo "cloud-init not installed — attempting best-effort auto-install (requires sudo)."
          echo "If this fails, pre-install per docs/operations.md → Setting up the runner."
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y cloud-init
          cloud-init --version

      # ── Cache the vsphere plugin ─────────────────────────────────────────────
      # Plugins live under ~/.config/packer/plugins/ on Linux. Keying on the
      # hash of packer.pkr.hcl invalidates the cache when required_plugins is
      # bumped. On a cache hit `packer init` is a near no-op (~1 s) instead of
      # downloading the plugin tarball from GitHub on every run (~6 s).
      - name: Cache Packer plugin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.config/packer/plugins
          key: packer-plugins-${{ runner.os }}-${{ hashFiles('packer.pkr.hcl') }}
          restore-keys: |
            packer-plugins-${{ runner.os }}-

      # ── Download vsphere plugin ──────────────────────────────────────────────
      - name: Packer init
        run: packer init .

      # ── Formatting check ─────────────────────────────────────────────────────
      # Fails if any .pkr.hcl file needs reformatting.
      # To auto-fix locally: packer fmt .
      - name: Check formatting
        run: |
          packer fmt -check -diff . && echo "Formatting OK" || {
            echo ""
            echo "One or more files need reformatting. Run locally:"
            echo "  packer fmt ."
            exit 1
          }

      # ── Syntax / variable validation ─────────────────────────────────────────
      # packer validate checks HCL syntax and that all required variables are
      # supplied. We pass placeholder values for variables that have no default
      # (the actual values are never used — no vSphere connection is made).
      - name: Validate all builds
        run: |
          packer validate \
            -var="vsphere_server=ci-validate" \
            -var="vsphere_user=ci-validate" \
            -var="vsphere_password=ci-validate" \
            -var="vsphere_datacenter=ci-validate" \
            -var="vsphere_cluster=ci-validate" \
            -var="vsphere_datastore=ci-validate" \
            -var="vsphere_network=ci-validate" \
            -var="vsphere_iso_datastore=ci-validate" \
            -var="build_password=ci-validate" \
            -var='build_password_encrypted=$6$civalidate$civalidate' \
            .

      # ── Cloud-init schema validation of the autoinstall user-data ───────────
      # `packer validate` catches HCL-side errors, but the body of each
      # autoinstall user-data file is cloud-config YAML that Packer treats as
      # opaque text. Without this step, the only validator for the user-data
      # is the actual install: a malformed `network:` or an un-nested netplan
      # key wouldn't surface until subiquity choked on it 5-15 minutes into a
      # real Packer build. This step renders each template with placeholder
      # values and runs `cloud-init schema` against the result — ~1 second.
      - name: Validate user-data against cloud-init schema
        run: bash scripts/lint-user-data.sh
